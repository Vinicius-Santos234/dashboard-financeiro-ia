name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Botão "Run workflow" na aba Actions. Existe porque parte da suíte depende
  # de secrets: quando um deles muda (rotação de senha, por exemplo), é preciso
  # reexecutar sem ter um commit novo para justificar.
  workflow_dispatch:

# Cancela a rodada anterior quando chega push novo no mesmo branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        # Os segredos são opcionais de propósito. Quando existem, o teste de
        # isolamento (tests/isolamento.test.ts) roda contra o Firebase real e
        # prova o critério de aceite da E1. Quando não existem, ele PULA e
        # avisa no log — e aí o verde do CI não cobre isolamento.
        #
        # Num repositório público isto é seguro: segredo não é exposto a PR
        # vindo de fork, então a suíte simplesmente pula nesses casos.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          TEST_USER_A_EMAIL: ${{ secrets.TEST_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.TEST_USER_A_PASSWORD }}
          TEST_USER_A_UID: ${{ secrets.TEST_USER_A_UID }}
          TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
          TEST_USER_B_PASSWORD: ${{ secrets.TEST_USER_B_PASSWORD }}
          TEST_USER_B_UID: ${{ secrets.TEST_USER_B_UID }}
        run: npm test

      - name: Build
        # Valores fictícios: o `next build` monta a configuração do Firebase em
        # tempo de módulo, mas não abre conexão nenhuma. Servem para o build
        # ser determinístico sem depender de segredo.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-fake-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-fake-project
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:0:web:0
        run: npm run build

# Falta aqui, e é uma lacuna consciente: validar o `firestore.rules` sem
# credencial. Compilar as regras exige autenticar no projeto, e conferir só
# que o arquivo existe seria teatro — daria selo verde sem verificar nada.
#
# O jeito certo é o emulador do Firestore com @firebase/rules-unit-testing,
# que roda as regras localmente e deixaria o teste de isolamento rodar em CI
# sem tocar o projeto real. Exige Java 11+ (o runner do GitHub tem; a máquina
# de desenvolvimento aqui está no Java 8). Fica como próximo passo.
